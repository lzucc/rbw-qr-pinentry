[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rbw-qr-pinentry"
version = "1.2.7"
description = "QR-code pinentry for rbw (Rust Bitwarden CLI) — unlock via phone scan"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
  { name = "rbw-qr-pinentry contributors" },
]
keywords = [
  "rbw",
  "bitwarden",
  "pinentry",
  "assuan",
  "qrcode",
  "password",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Utilities",
]
dependencies = [
  "qrcode>=7.4",
]

[project.optional-dependencies]
# Pillow is only needed for image QR output; ASCII terminal QR works without it.
pil = [
  "Pillow>=9.0",
]

[project.urls]
Homepage = "https://github.com/lzucc/rbw-qr-pinentry"
Issues = "https://github.com/lzucc/rbw-qr-pinentry/issues"
Source = "https://github.com/lzucc/rbw-qr-pinentry"

[project.scripts]
rbw-qr-pinentry = "rbw_qr_pinentry.pinentry:cli"

# hatchling auto-discovers src/rbw_qr_pinentry
